<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100d17" />
    <meta
      name="description"
      content="Your world of cinema. Discover movies and series, build your watchlist, and make every night a movie night with CineLocal."
    />
    <title>CineLocal — Your personal cinema</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=20261013-purple" />
    <script type="module" src="/js/app.js?v=20261013-purple"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-action="skip-content"
      >Skip to content</a
    >
    <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
    <button
      class="nav-scrim"
      data-action="close-menu"
      aria-label="Close navigation"
      tabindex="-1"
    ></button>
    <nav
      id="mobile-nav"
      class="mobile-nav"
      aria-label="Mobile navigation"
    ></nav>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1">
        <div class="initial-loading">
          <span class="loading-orbit"></span>
          <p>Setting the scene…</p>
        </div>
      </main>
      <footer class="footer">
        <span
          >CINELOCAL <span class="footer-dot">•</span> A little escape. A great
          story.</span
        ><span
          >Metadata by
          <a
            href="https://www.themoviedb.org"
            target="_blank"
            rel="noopener noreferrer"
            >TMDB</a
          ><span class="footer-dot">/</span> Not endorsed or certified by
          TMDB.</span
        >
      </footer>
    </div>
    <dialog
      id="details-dialog"
      class="details-dialog"
      aria-label="Title details"
    ></dialog>
    <dialog
      id="watch-dialog"
      class="watch-dialog"
      aria-label="Video player"
    ></dialog>
    <dialog
      id="shortcuts-dialog"
      class="shortcuts-dialog"
      aria-labelledby="shortcut-title"
    ></dialog>
    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <input
      id="backup-input"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <input
      id="video-input"
      type="file"
      accept="video/*,.mkv,.webm,.mp4,.mov"
      hidden
    />
    <input id="subtitle-input" type="file" accept=".vtt,.srt" hidden />
    <noscript
      ><p class="noscript">
        CineLocal needs JavaScript enabled to browse your cinema.
      </p></noscript
    >
  </body>
</html>
